name: Проверка качества

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Получить исходники
        uses: actions/checkout@v7
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Установить FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Установить зависимости
        run: npm ci
      - name: Проверить проект
        run: npm run verify

  secrets:
    name: Поиск случайно добавленных секретов
    runs-on: ubuntu-latest
    steps:
      - name: Получить полную историю
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Запустить Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
