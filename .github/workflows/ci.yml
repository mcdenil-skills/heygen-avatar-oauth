name: Проверка качества

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Установить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Установить FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Установить зависимости
        run: npm ci
      - name: Проверить проект
        run: npm run verify

  secrets:
    name: Поиск случайно добавленных секретов
    runs-on: ubuntu-latest
    steps:
      - name: Получить полную историю
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Установить Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.24.11
          cache: false
      - name: Запустить Gitleaks
        env:
          GOBIN: ${{ runner.temp }}/gitleaks-bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$GOBIN/gitleaks" git --no-banner --redact
